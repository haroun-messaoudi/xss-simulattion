<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>XSS Demo</title>
  </head>
  <body>
    <h1>Login</h1>
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <h2>User Info</h2>
    <div id="userInfo" style="font-family: sans-serif; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; max-width: 500px; background: #f9f9f9;"></div>


    <!-- icons cdn -->
    <script src="http://localhost:5000/icons.js"></script>
    <script>
      async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
      
        const res = await fetch('http://localhost:4000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if(res.status !== 200) {
          alert('Password or email is incorrect');
          return;
        }
        const data = await res.json();
        
        if (data.token) {
          localStorage.setItem('token', data.token);
          loadUser();
        } else {
          alert('Login failed');
        }
      }

      async function loadUser() {
        const token = localStorage.getItem('token');
        if (!token) return;
      
        const res = await fetch('http://localhost:4000/api/userInfo', {
          headers: { Authorization: `Bearer ${token}` }
        });
      
        const user = await res.json();
        const userInfo = document.getElementById('userInfo');
      
        userInfo.innerHTML = `
          <h3>User Profile</h3>
          <p><strong>Name:</strong> ${user.name}</p>
          <p><strong>Email:</strong> ${user.email}</p>`;
        const icon = Icon({ name: 'check', size: 18, color: 'orange' });
        document.getElementById('userInfo').before(icon);
      }
      window.addEventListener('DOMContentLoaded', loadUser);
    </script>
  </body>
</html>
